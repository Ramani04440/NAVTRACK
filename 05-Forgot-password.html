<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Forgot Password Desktop</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet"/>
<script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    fontFamily: {
                        display: ["Poppins", "sans-serif"],
                        sans: ["Poppins", "sans-serif"],
                    },
                    colors: {
                        primary: "#10b981", 
                        "background-light": "#f3f4f6",
                        "background-dark": "#0B1120", // Deep dark navy
                        card: {
                            light: "#ffffff",
                            dark: "#161E2E", // Slightly lighter navy for card
                        },
                        accent: {
                            cyan: "#06b6d4",
                            green: "#10b981",
                        }
                    },
                    borderRadius: {
                        DEFAULT: "0.5rem",
                        '3xl': '1.5rem',
                    },
                    boxShadow: {
                        'glow-cyan': '0 0 25px rgba(6, 182, 212, 0.5)',
                        'glow-green': '0 4px 20px rgba(16, 185, 129, 0.4)',
                        'card-dark': '0 20px 40px -5px rgba(0, 0, 0, 0.6)',
                    }
                },
            },
        };
    </script>
<style>
        body {
            font-family: 'Poppins', sans-serif;
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark min-h-screen flex flex-col items-center justify-center relative overflow-hidden transition-colors duration-300">
<div class="absolute inset-0 z-0 overflow-hidden pointer-events-none">
<div class="absolute top-[-10%] left-[-10%] w-[500px] h-[500px] bg-blue-600/10 dark:bg-blue-500/10 rounded-full blur-[120px]"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[400px] h-[400px] bg-emerald-500/10 dark:bg-emerald-500/5 rounded-full blur-[100px]"></div>
<span class="material-icons-round absolute top-[15%] right-[15%] text-slate-300/30 dark:text-slate-700/20 text-[120px] transform rotate-12 hidden lg:block select-none">
            directions_car
        </span>
<span class="material-icons-round absolute bottom-[15%] left-[15%] text-slate-300/30 dark:text-slate-700/10 text-[100px] transform -rotate-12 hidden lg:block select-none">
            vpn_key
        </span>
</div>
<main class="relative z-10 w-full max-w-[440px] px-6 py-8 md:px-10 md:py-12 bg-card-light dark:bg-card-dark rounded-3xl shadow-xl dark:shadow-card-dark border border-gray-100 dark:border-white/5 mx-4 transition-all duration-300">
<div class="flex justify-center mb-8 relative">
<div class="w-24 h-24 rounded-full bg-gradient-to-br from-cyan-400 to-accent-cyan flex items-center justify-center shadow-glow-cyan relative z-10">
<span class="material-icons-round text-white text-[3rem]">security</span>
</div>
<div class="absolute top-0 right-[calc(50%-48px)] transform translate-x-2 -translate-y-1 w-8 h-8 bg-accent-green rounded-full flex items-center justify-center border-2 border-white dark:border-card-dark z-20 shadow-md">
<span class="material-icons-round text-white text-sm">lock</span>
</div>
<div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-28 h-28 bg-accent-cyan/20 blur-xl rounded-full"></div>
</div>
<div class="text-center mb-8 space-y-3">
<h1 class="text-2xl md:text-3xl font-bold text-gray-900 dark:text-white tracking-tight">Forgot Password?</h1>
<p class="text-gray-500 dark:text-gray-400 text-sm md:text-[15px] leading-relaxed">
                Enter your registered email or phone number to receive a reset link.
            </p>
</div>
<form class="space-y-6" onsubmit="event.preventDefault();">
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-icons-round text-gray-400 text-[20px] group-focus-within:text-accent-green transition-colors">mail_outline</span>
</div>
<input aria-label="Email or phone number" class="block w-full pl-11 pr-4 py-3.5 bg-white border-none rounded-xl text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-accent-green/50 shadow-sm text-sm md:text-base h-12 md:h-14" placeholder="Email or phone number" type="text"/>
</div>
<button class="w-full py-3.5 px-4 bg-gradient-to-r from-emerald-400 to-emerald-600 hover:from-emerald-500 hover:to-emerald-700 text-white font-semibold rounded-xl shadow-glow-green transform transition-all duration-200 hover:-translate-y-0.5 active:translate-y-0 flex items-center justify-center gap-2 h-12 md:h-14" type="submit">
<span class="material-icons-round text-[1.2rem] transform -rotate-45 mb-1">send</span>
<span class="tracking-wide">Send Reset Link</span>
</button>
</form>
<div class="mt-6 text-center">
<a class="inline-flex items-center gap-1.5 text-accent-green hover:text-emerald-400 font-medium transition-colors text-sm md:text-[15px] group" href="#">
<span class="material-icons-round text-lg transform group-hover:-translate-x-1 transition-transform">arrow_back</span>
                Back to Login
            </a>
</div>
<div class="my-8 border-t border-gray-200 dark:border-gray-700/50 w-full"></div>
<div class="flex items-start gap-3 px-1">
<span class="material-icons-round text-accent-cyan text-[20px] shrink-0 mt-0.5">help_outline</span>
<p class="text-xs text-gray-500 dark:text-gray-400 leading-snug">
                 We will never share your information with anyone.
             </p>
</div>
<div class="absolute bottom-[-20px] left-[-20px] w-32 h-32 bg-accent-cyan/5 rounded-full blur-2xl pointer-events-none"></div>
</main>
<div class="relative z-10 mt-8 text-center animate-fade-in-up">
<p class="text-sm text-gray-600 dark:text-gray-400">
            Need help? 
            <a class="text-accent-green font-medium hover:text-emerald-400 transition-colors ml-1" href="#">Contact Support</a>
</p>
</div>

</body></html>
